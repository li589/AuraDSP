name: auradsp_app
description: "AuraDSP — 跨平台音频效果应用（UI 层）。APP = AuraDSP Engines + UI 主体框架。"
publish_to: "none"
version: 0.5.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  file_selector: ^1.0.3
  ffi: ^2.1.0
  window_manager: ^0.5.2
  tray_manager: ^0.8.0
  nativeapi: ^0.5.2
  nativeapi_flutter: ^0.5.2
  # Linux 媒体会话（MPRIS over 会话总线，S5b）：纯 Dart D-Bus 客户端。
  dbus: ^0.7.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  # 出厂预设统一外置为 JSON（2026-10-16：代码中不再存储任何预设内容）
  assets:
    - assets/presets/defaults.json
    - assets/presets/factory/
    - assets/presets/plugin_tables.json
    - assets/tray_icon.ico
    - assets/tray_icon.png

  shaders:
    - shaders/aurora_wave.frag
    - shaders/neon_tunnel.frag

  fonts:
    - family: AuraDisplay
      fonts:
        - asset: assets/fonts/BricolageGrotesque.ttf
    - family: AuraDisplayCJK
      fonts:
        - asset: assets/fonts/SmileySans-Oblique.ttf
    - family: AuraMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
