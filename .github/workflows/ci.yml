# AuraDSP CI（S4 落地，《Linux适配方案-2026-11-01》§4.1）
#
# Job 形态与方案一一对应：
#   J1 gate-static        静态门禁（跨平台纯 Python，不需要构建产物）
#   J2 build-engine-linux Linux 引擎构建（cmake preset）
#   J3 smoke-linux        Linux smoke 全套（依赖 J2 产物）
#   J4 abi-linux          ABI 一致性（含 S4 新增的 version script 校验）
#   J5 build-engine-windows Windows 引擎构建（与 Linux 同等对待）
#   J6 dart-tests         Dart 测试门禁（run_dart_tests.py 串行+重试）
#   J7 asset-guard        资源守卫（.irs/.vdc 等不得入库）
#   J8 build-app-linux    App 本体构建（Linux bundle + 无头启动冒烟；
#                         补 J1–J7 从不编译 runner/CMake 打包面的盲区）
#
# 与方案的一处口径扩展：方案把 J4/J5/J6/J7 定为 PR 触发；这里 push
# 同样触发，让 feature/linux 在提 PR 之前就先全绿一遍（分支策略：
# feature/linux 只向 dev 提 PR，PR 时同一套 job 再跑一次）。
name: CI

on:
  push:
    branches: [feature/linux, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # J1 静态门禁 ------------------------------------------------------
  gate-static:
    name: J1 gate-static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version script freshness (.def -> .map)
        run: python3 tools/bin/gen_engine_map.py --check
      - name: Platform isolation gate
        run: python3 test/smoke/smoke_platform_isolation.py
      - name: Dart platform quarantine gate
        run: python3 test/smoke/smoke_dart_platform_quarantine.py
      - name: Linux source table gate
        run: python3 test/smoke/smoke_linux_source_table.py

  # J2 Linux 引擎构建 -------------------------------------------------
  build-engine-linux:
    name: J2 build-engine-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ python3 gcc-multilib g++-multilib
      - name: Configure
        run: cmake --preset linux-x64 -DAURADSP_BUILD_HOST_X86=ON
      - name: Build
        run: cmake --build --preset linux-x64-release
      - name: Upload engine artifact
        uses: actions/upload-artifact@v4
        with:
          name: libauradsp_engine-linux
          path: |
            core/desktop/linux/out/Release/libauradsp_engine.so
            core/desktop/linux/out/Release/plugin_host_x64
            core/desktop/linux/out/Release/plugin_host_x86
          if-no-files-found: error
          # 该产物只作同一 run 内 J3/J6/J8 的跨 job 传递，保留期取
          # 7 天：足够失败排障与复跑取证，又避免默认 90 天囤积把
          # 账户 artifact 存储配额占满（曾囤 128 个占满，见
          # installer/docs/01 §5 存储注记）。Release 资产是另一套
          # 存储，不受此配额影响。
          retention-days: 7

  # J3 Linux smoke ----------------------------------------------------
  smoke-linux:
    name: J3 smoke-linux
    runs-on: ubuntu-latest
    needs: build-engine-linux
    steps:
      - uses: actions/checkout@v4
      - name: Download engine artifact
        uses: actions/download-artifact@v4
        with:
          name: libauradsp_engine-linux
          path: core/desktop/linux/out/Release
      - name: Restore host exec bits (artifact round-trip drops +x)
        run: chmod +x core/desktop/linux/out/Release/plugin_host_x64 core/desktop/linux/out/Release/plugin_host_x86 2>/dev/null || true
      # 起一个带 null-sink 的 PulseAudio，让 smoke_linux_pulse_output
      # 在流水线里实跑而不是自 SKIP（无服务时该门禁按惯例跳过）。
      # multilib 同装：插件门禁的 x86 节要现场编译 -m32 探针插件，
      # 缺 multilib 时该节只能 SKIP（桥活体拿不到 CI 证据）。
      - name: Start PulseAudio with null sink
        run: |
          sudo apt-get update
          sudo apt-get install -y pulseaudio gcc-multilib g++-multilib
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=auradsp_ci
          pactl set-default-sink auradsp_ci
      - name: Run smoke suite
        run: python3 test/runner.py --smoke

  # J4 ABI 一致性 -------------------------------------------------------
  abi-linux:
    name: J4 abi-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ABI consistency (.def / .h / Dart FFI / .map / viz / bridges)
        run: python3 tools/bin/abi_consistency.py

  # J5 Windows 引擎构建 -------------------------------------------------
  build-engine-windows:
    name: J5 build-engine-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # 桥/驱动套件需要 Steinberg ASIO SDK（授权制外部工具链，本机路径
      # 引用、不入库），stock runner 没有 —— 用工程自带的
      # AURADSP_BUILD_BRIDGES=OFF（即 build_windows.ps1 -SkipDrivers
      # 的同一开关）只建引擎 + 插件宿主；三桥由本机 Windows 构建覆盖。
      - name: Configure
        run: cmake --preset windows-x64 -DAURADSP_BUILD_BRIDGES=OFF
      - name: Build
        run: cmake --build --preset windows-x64-release
      # APO 纪律版引擎供 J5b 的进程内冒烟宿主（D1 同目录搜索）；
      # 必须在 DBG-ON 变体覆盖 out/Release 之前上传默认构建产物。
      - name: Upload APO engine artifact (for J5b)
        uses: actions/upload-artifact@v4
        with:
          name: auradsp-engine-apo-windows
          path: core/desktop/windows/out/Release/auradsp_engine_apo.dll
          if-no-files-found: error
          retention-days: 7
      # B-1 门禁进 CI（2026-11-08 审计·调试中3）：smoke_release_strings
      # 此前只登记在 runner.py 的 PLATFORM_WINDOWS 集，CI 从未执行，
      # 「防宏没接线」的反向断言长期空转。先对默认（OFF）产物跑正向
      # 断言（Release DLL 无 [DBG ），再用独立构建树编一份 ON 产物跑
      # 反向断言（引擎 DLL 与宿主 exe 都必须含 [DBG ）——产物同写
      # 子工程 out/Release，后步会覆盖前步 DLL，故必须顺序执行。
      - name: Release-strings gate (default OFF build)
        run: python test/smoke/smoke_release_strings.py
      # APO 引擎变体纪律门（2026-11-10 立项 P2）：PE 本体断言
      # /MT（无动态 CRT 导入）+ CFG 函数表 + 导出面。必须在
      # DBG-ON 变体覆盖 out/Release 之前跑（同 release-strings）。
      - name: APO engine binary gate (default build)
        run: python test/smoke/smoke_apo_engine_binary.py
      - name: Configure ON variant (AURADSP_DBG_LOG)
        run: cmake -S . -B build/windows/dbg-on -G "Visual Studio 18 2026" -A x64 -DAURADSP_BUILD_BRIDGES=OFF -DAURADSP_DBG_LOG=ON
      - name: Build ON variant
        run: cmake --build build/windows/dbg-on --config Release
      - name: Release-strings gate (ON build, engine)
        env:
          AURADSP_EXPECT_DBG: "1"
        run: python test/smoke/smoke_release_strings.py
      - name: Release-strings gate (ON build, plugin host)
        env:
          AURADSP_EXPECT_DBG: "1"
          AURADSP_DLL: core/desktop/windows/out/Release/plugin_host_x64.exe
        run: python test/smoke/smoke_release_strings.py

  # J5b APO 家族构建 --------------------------------------------------
  build-apo-windows:
    name: J5b build-apo-windows
    runs-on: windows-latest
    needs: build-engine-windows
    steps:
      - uses: actions/checkout@v4
      - name: Download APO engine artifact (from J5)
        uses: actions/download-artifact@v4
        with:
          name: auradsp-engine-apo-windows
          path: core/desktop/windows-drivers/out/Release
      # 驱动套件全量构建需要 Steinberg ASIO SDK（stock runner 没有）；
      # APO 家族（AuraApo + 引擎宿主 / apo_config / apo_selftest 等）
      # 以 AURADSP_DRIVERS_APO_ONLY 独立配置构建，给这部分此前只在
      # 用户本机编译的 C++ 以真实 MSVC 覆盖。引擎纪律版 DLL 本体
      # 由 J5 构建并过 PE 纪律门（smoke_apo_engine_binary）。
      - name: Configure (APO only)
        run: cmake -S core/desktop/windows-drivers -B build/windows/apo-only -G "Visual Studio 18 2026" -A x64 -DAURADSP_DRIVERS_APO_ONLY=ON
      - name: Build
        run: cmake --build build/windows/apo-only --config Release
      # 真处理端到端冒烟：COM 直驱 APOProcess，断言参数通道
      # 发布 input.gain=0.25 后输出 RMS 相对基线跌至 ~0.25、
      # telemetry 座位/应用计数/频谱在动、INPLACE 变体一致、
      # 解锁后座位释放。退出码即裁定。
      - name: APO engine end-to-end smoke
        run: core/desktop/windows-drivers/out/Release/apo_engine_test.exe

  # J6 Dart 测试 --------------------------------------------------------
  dart-tests:
    name: J6 dart-tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # 依赖 J2 并取回引擎产物：ui_stereo_restore 等用例走引擎真探针
    # （probe_is_supported 经 FFI 实测），无 .so 时断言落空 —— 本地
    # 跑得过正是因为工作区里有构建好的引擎。CI 必须复刻同一条件，
    # 把产物放到 engine_artifact 的仓库相对候选路径上。
    needs: build-engine-linux
    steps:
      - uses: actions/checkout@v4
      - name: Download engine artifact
        uses: actions/download-artifact@v4
        with:
          name: libauradsp_engine-linux
          path: core/desktop/linux/out/Release
      - name: Restore host exec bits (artifact round-trip drops +x)
        run: chmod +x core/desktop/linux/out/Release/plugin_host_x64 core/desktop/linux/out/Release/plugin_host_x86 2>/dev/null || true
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-14-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Pub get
        working-directory: app/auradsp_app
        run: flutter pub get
      # 注意（方案 §4.1）：run_dart_tests.py 的重试参数是在 Windows
      # 本机标定的；Linux CI 上若出现基建型抖动，先重标定再动门禁。
      # Windows 范式专属的 4 个测试文件（ASIO/VAIO/插件宿主 UI）由
      # 脚本内的 WINDOWS_ONLY 清单在非 Windows 主机显式 SKIP-PLATFORM，
      # 与 Python 侧 runner.py 的 PLATFORM_WINDOWS 同口径（S4）。
      - name: Dart tests (serial + retry gate)
        run: python3 tools/bin/run_dart_tests.py

  # J7 资源守卫 ---------------------------------------------------------
  asset-guard:
    name: J7 asset-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Untracked asset scan (.irs/.vdc must not be tracked)
        run: python3 tools/bin/assets_untracked_scan.py

  # J8 App 本体构建 ------------------------------------------------------
  # J1–J7 没有一个 job 真正编译过 Flutter Linux 本体：runner 的 C++
  # （my_application.cc）、linux/CMakeLists 打包规则只被本地构建覆盖，
  # 2026-11-02 真机轮次的 Impeller 修复（080beb0）正是改这类文件、
  # 靠本地兜底。本 job 补齐：全量 release 构建 + 对真实产物跑 bundle
  # 布局门禁 + 无头启动冒烟（Xvfb + null-sink，从调试日志断言引擎
  # 加载与 PulseAudio 输出流打开，与 S3 本地验收同口径）。
  build-app-linux:
    name: J8 build-app-linux
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build-engine-linux
    steps:
      - uses: actions/checkout@v4
      - name: Download engine artifact
        uses: actions/download-artifact@v4
        with:
          name: libauradsp_engine-linux
          path: core/desktop/linux/out/Release
      - name: Restore host exec bits (artifact round-trip drops +x)
        run: chmod +x core/desktop/linux/out/Release/plugin_host_x64 core/desktop/linux/out/Release/plugin_host_x86 2>/dev/null || true
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-14-dev pulseaudio xvfb
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Pub get
        working-directory: app/auradsp_app
        run: flutter pub get
      - name: Build Linux bundle
        working-directory: app/auradsp_app
        run: flutter build linux --release --no-tree-shake-icons
      - name: Bundle layout gate
        run: python3 test/smoke/smoke_linux_bundle_layout.py
      - name: Headless launch smoke
        run: |
          # 就绪等待与现场保留（2026-11-04 加固）：原脚本拉起 PA/Xvfb 后
          # 不做就绪确认即启动 App、且把 App 输出丢弃——慢速 runner 上
          # 显示/音频未就绪时 App 在 GTK 初始化期静默退出或首启耗时
          # （fontconfig 建缓存、软件渲染着色器编译）挤爆 60 秒窗口，
          # 表现为「调试日志始终不出现」且无任何证据可查。2026-11-03
          # 起 J8 连续多轮如此失败，而同期代码（仅测试文件）、runner
          # 镜像、Flutter 版本均无变化，定性为启动时序竞态 + 诊断缺失。
          pulseaudio --start --exit-idle-time=-1
          for i in $(seq 1 20); do
            if pactl info >/dev/null 2>&1; then break; fi
            sleep 1
          done
          pactl info >/dev/null
          pactl load-module module-null-sink sink_name=auradsp_ci
          pactl set-default-sink auradsp_ci
          Xvfb :99 -screen 0 1280x800x24 &
          export DISPLAY=:99
          for i in $(seq 1 20); do
            if [ -S /tmp/.X11-unix/X99 ]; then break; fi
            sleep 1
          done
          [ -S /tmp/.X11-unix/X99 ]
          fc-cache -f >/dev/null 2>&1 || true
          rm -f /tmp/auradsp_debug.log /tmp/auradsp_debug_iso.log
          cd app/auradsp_app/build/linux/x64/release/bundle
          ./auradsp_app >/tmp/j8_app_stdout.log 2>&1 &
          APP_PID=$!
          ok=0
          for i in $(seq 1 60); do
            if grep -q "AudioOut started (PulseAudioOut)" /tmp/auradsp_debug.log /tmp/auradsp_debug_iso.log 2>/dev/null; then ok=1; break; fi
            if ! kill -0 $APP_PID 2>/dev/null; then echo "app exited before audio start"; break; fi
            sleep 2
          done
          kill $APP_PID 2>/dev/null || true
          if [ $ok -ne 1 ]; then
            echo "=== app stdout/stderr ==="
            cat /tmp/j8_app_stdout.log || true
            echo "=== auradsp_debug.log ==="
            cat /tmp/auradsp_debug.log || true
            echo "=== auradsp_debug_iso.log ==="
            cat /tmp/auradsp_debug_iso.log || true
          fi
          grep -q "PULSE init: stream open" /tmp/auradsp_debug.log /tmp/auradsp_debug_iso.log
          test $ok -eq 1
